# ===== Nama Aplikasi =====
spring.application.name=Spring_Boot_Rest_API

# ===== Konfigurasi Database MySQL =====
# Ganti 'springbootdb1' dengan nama database kamu
spring.datasource.url=jdbc:mysql://localhost:3306/springbootdb1
spring.datasource.username=root
spring.datasource.password=

# ===== JPA / Hibernate Settings =====
# 'update' = otomatis buat/update tabel saat aplikasi jalan
spring.jpa.hibernate.ddl-auto=update

# Tampilkan query SQL di console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialect MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
